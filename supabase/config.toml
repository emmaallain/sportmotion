# Local development: `supabase start`, then `supabase functions serve`.
project_id = "sportmotion"

[auth]
# Guests play immediately; they can attach an e-mail later from the profile screen.
enable_anonymous_sign_ins = true

[functions.validate-activity]
verify_jwt = true

[functions.game-command]
verify_jwt = true

[functions.strava-connect]
verify_jwt = true

[functions.strava-sync]
verify_jwt = true

# Strava redirects the browser here after the consent screen: there is no session token on
# that request. The single-use `state` value identifies the player instead.
[functions.strava-callback]
verify_jwt = false
